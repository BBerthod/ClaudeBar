name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Swift Release Build
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Model catalog freshness
        shell: bash
        run: |
          set -euo pipefail
          GENERATED_AT=$(grep -o 'static let generatedAt = "[^"]*"' Sources/ClaudeBar/Models/ModelCatalogSnapshot.swift | cut -d '"' -f 2)
          GENERATED_EPOCH=$(TZ=UTC date -j -f "%Y-%m-%dT%H:%M:%SZ" "$GENERATED_AT" +%s)
          AGE=$(( $(date +%s) - GENERATED_EPOCH ))
          if (( AGE > 90 * 24 * 60 * 60 )); then
            echo "::error::Model catalog is older than 90 days; run make catalog."
            exit 1
          fi

      - name: Build (release)
        # Without pipefail the step's status is tee's, so a failed compile stays green.
        shell: bash
        run: set -o pipefail; swift build -c release 2>&1 | tee build.log

      - name: Fail on warnings
        run: |
          if grep -E "warning:" build.log; then
            echo "Build warnings detected — failing."
            exit 1
          fi

      - name: Unit tests
        # Snapshot tests depend on the runner's exact text rasterisation and are
        # validated locally; every other suite runs here.
        shell: bash
        run: |
          set -o pipefail
          if ! swift test --skip SnapshotTests > test.log 2>&1; then
            echo "::error::swift test failed — failing cases and errors:"
            grep -E "error:|failed|Fatal error" test.log | head -60
            tail -20 test.log
            exit 1
          fi
          grep -E "Executed [0-9]+ tests|Test run with" test.log | tail -3

      - name: Binary size
        run: |
          BIN=$(swift build -c release --show-bin-path 2>/dev/null)/ClaudeBar
          if [ -f "$BIN" ]; then
            SIZE=$(du -sh "$BIN" | cut -f1)
            echo "Binary size: $SIZE"
          fi
